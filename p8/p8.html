
<!DOCTYPE html>
<html>
<head>
    <title>String and Math Functions</title>
</head>
<body>

<h2>JavaScript String and Math Functions</h2>

<script>
    // String Object
    let str = "Hello World";

    document.write("<h3>String Functions</h3>");
    document.write("Original String: " + str + "<br>");
    document.write("Length: " + str.length + "<br>");
    document.write("Uppercase: " + str.toUpperCase() + "<br>");
    document.write("Lowercase: " + str.toLowerCase() + "<br>");
    document.write("Character at index 2: " + str.charAt(2) + "<br>");
    document.write("Substring: " + str.substring(0, 5) + "<br>");

    // Math Object
    let num = 18.6;

    document.write("<h3>Math Functions</h3>");
    document.write("Number: " + num + "<br>");
    document.write("Square Root of 25: " + Math.sqrt(25) + "<br>");
    document.write("2 Power 3: " + Math.pow(2, 3) + "<br>");
    document.write("Round of num: " + Math.round(num) + "<br>");
    document.write("Ceiling: " + Math.ceil(num) + "<br>");
    document.write("Floor: " + Math.floor(num) + "<br>");
    document.write("Random Number: " + Math.random());
</script>

</body>
</html>

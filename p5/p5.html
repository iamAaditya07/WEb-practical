
<!DOCTYPE html>
<html>
<head>
    <title>CSS Styles Example</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        h2 {
            color: blue;
            text-align: center;
        }

        p {
            font-size: 18px;
            color: green;
        }
    </style>
</head>

<body>

    <h1 style="color:red; text-align:center;">
        Welcome to CSS Styling
    </h1>

    <h2>Internal CSS Example</h2>

    <p>This paragraph is styled using Internal CSS.</p>

    <div class="box">
        This section is styled using External CSS.
    </div>

    <p style="color:purple; font-size:20px;">
        This paragraph uses Inline CSS.
    </p>

</body>
</html>

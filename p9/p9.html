<!doctype html>
<html>
  <head>
    <title>Array and Date Functions</title>
  </head>
  <body>
    <script>
      // Array Object
      let arr = [1, 2, 9, 5, 8];

      document.write("<h3>Array Functions</h3>");
      document.write("Original Array: " + arr + "<br>");
      document.write("Length: " + arr.length + "<br>");

      arr.push(90);
      document.write("After Push: " + arr + "<br>");

      arr.pop();
      document.write("After Pop: " + arr + "<br>");

      arr.unshift(4);
      document.write("After Unshift: " + arr + "<br>");

      arr.shift();
      document.write("After Shift: " + arr + "<br>");

      document.write("Index of 30: " + arr.indexOf(5) + "<br>");
      document.write("Sorted Array: " + arr.sort() + "<br>");

      // Date Object
      let dt = new Date();

      document.write("<h3>Date Functions</h3>");
      document.write("Current Date: " + dt + "<br>");
      document.write("Date: " + dt.getDate() + "<br>");
      document.write("Month: " + (dt.getMonth() + 1) + "<br>");
      document.write("Year: " + dt.getFullYear() + "<br>");
      document.write("Hours: " + dt.getHours() + "<br>");
      document.write("Minutes: " + dt.getMinutes() + "<br>");
      document.write("Seconds: " + dt.getSeconds() + "<br>");
    </script>
  </body>
</html>
